[package]
name = "obelisk-activity-vm-http-proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = [
    "logging",
    "ring",
    "std",
    "tls12",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
